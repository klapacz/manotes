packages:
  - "apps/*"
  - "packages/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.16
  vite-plus: ^0.1.16
  vitest: npm:@voidzero-dev/vite-plus-test@latest

ignoredBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - sharp

onlyBuiltDependencies:
  - workerd
overrides:
  vite: "catalog:"
  vitest: "catalog:"

patchedDependencies:
  drizzle-orm: patches/drizzle-orm.patch
  effect: patches/effect.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
