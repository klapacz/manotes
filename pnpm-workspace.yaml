packages:
  - "apps/*"
  - "packages/*"
catalog:
  "@effect/platform-browser": 4.0.0-rc.112
  "@effect/platform-bun": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/platform-node-shared": 4.0.0-rc.112
  "@effect/sql-d1": 4.0.0-rc.112
  "@effect/sql-sqlite-do": 4.0.0-rc.112
  "@effect/sql-sqlite-node": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  alchemy: 2.0.0-beta.77
  effect: 4.0.0-rc.112
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  vitest: 4.1.11

ignoredBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - sharp

onlyBuiltDependencies:
  - better-sqlite3
  - workerd
overrides:
  # Catalogs do not constrain transitive dependencies. These ranges allow newer
  # Effect RCs that are incompatible with Alchemy beta.77.
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/vitest": "catalog:"
  vite: "catalog:"
  vitest: "catalog:"

patchedDependencies:
  "@kobalte/core@2.0.0-alpha.2": patches/@kobalte__core@2.0.0-alpha.2.patch
  "@tanstack/solid-form@1.29.0": patches/@tanstack__solid-form@1.29.0.patch
  "@tanstack/solid-store@0.9.3": patches/@tanstack__solid-store@0.9.3.patch
  drizzle-orm: patches/drizzle-orm.patch
  lucide-solid@1.20.0: patches/lucide-solid@1.20.0.patch
  virtua@0.48.8: patches/virtua@0.48.8.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    # Solid 2 ecosystem packages still pin or cap older Solid prereleases.
    "@solidjs/web": "2"
    solid-js: "2"
    vite: "*"
    vitest: "*"
